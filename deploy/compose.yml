name: zenit-plataforma

# Epica 0 completa: borde, punto de entrada, almacen de series, API e interfaz.
#
#   internet ──4317 (OTLP, TLS)──▶ borde ──▶ ingesta ──▶ influxdb
#   equipo   ──443 (HTTPS)──────▶ borde ──▶ api ──────▶ influxdb
#                                       └─▶ web
#
# Solo el borde publica puertos. El grupo de seguridad limita el 4317 a las IP
# de los nodos (admitir-nodo.sh) y el 443 a las del equipo (abrir-interfaz.sh).

x-influx: &influx
  INFLUX_URL: http://influxdb:8181
  INFLUX_TOKEN: ${INFLUX_TOKEN:?falta INFLUX_TOKEN; corre scripts/influx/preparar-token.sh}
  INFLUX_BD: zenit_raw

services:

  influxdb:
    image: influxdb:${VERSION_INFLUX:-3-core}
    restart: unless-stopped
    # Se fija el binario para no depender de como resuelva los argumentos el
    # entrypoint de la imagen.
    entrypoint: ["influxdb3"]
    command:
      - serve
      - --node-id=zenit
      - --object-store=file
      - --data-dir=/var/lib/influxdb3/data
      - --admin-token-file=/run/zenit/influx-admin.json
      - --disable-authz=health,ping
    volumes:
      - influx_datos:/var/lib/influxdb3
      - type: bind
        source: ./secretos/influx-admin.json
        target: /run/zenit/influx-admin.json
        read_only: true
    # 8181 NO se publica: solo lo alcanzan la ingesta y la API
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/8181 && printf 'GET /health HTTP/1.0\\r\\n\\r\\n' >&3 && head -1 <&3 | grep -q ' 200'"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s

  # Una sola vez por arranque: crea las tres bases con su retencion. Es
  # idempotente, asi que repetirlo no hace dano.
  influxdb-bases:
    image: ghcr.io/${ORG_GITHUB:?falta ORG_GITHUB}/zenit-api:${VERSION_API:-0.2.0}
    build:
      context: ../backend
      dockerfile: Dockerfile.api
    command: ["python", "-m", "zenit.admin", "crear-bases"]
    restart: "no"
    environment:
      <<: *influx
      RETENCION_RAW: ${RETENCION_RAW:-7d}
      RETENCION_1M: ${RETENCION_1M:-30d}
      RETENCION_1H: ${RETENCION_1H:-180d}
    depends_on:
      influxdb:
        condition: service_healthy

  ingesta:
    image: ghcr.io/${ORG_GITHUB:?falta ORG_GITHUB}/zenit-ingesta:${VERSION_INGESTA:-0.2.0}
    build:
      context: ../backend              # incluye el paquete compartido zenit/
      dockerfile: ingesta/Dockerfile
    restart: unless-stopped
    # Al detenerse, la ingesta deja de aceptar y vacia su cola en el almacen.
    # Los 10 s por defecto de Docker no alcanzan si el almacen esta lento.
    stop_grace_period: 30s
    environment:
      <<: *influx
      ZENIT_ENTORNO:   ${ZENIT_ENTORNO:-desconocido}
      ZENIT_PROVEEDOR: ${ZENIT_PROVEEDOR:-desconocido}
      ZENIT_REGION:    ${ZENIT_REGION:-desconocido}
      RUTA_SALIDA:     /datos/salida   # trazas y registros, hasta la epica 1
      RUTA_CATALOGO:   /etc/zenit/catalogo/catalogo.json
      TOKEN_INGESTA:   ${TOKEN_INGESTA:?falta el token de ingesta}
      SERVICIO_POR_DEFECTO: ${SERVICIO_POR_DEFECTO:-host}
    volumes:
      - ingesta_datos:/datos
      # Se monta la carpeta y no el archivo: un montaje de archivo suelto no
      # ve los cambios cuando el editor reemplaza el archivo, y el catalogo
      # se relee en caliente.
      - ./catalogo:/etc/zenit/catalogo:ro
    ports:
      - "127.0.0.1:8080:8080"         # salud y contadores: solo desde dentro
    # 4317 NO se publica: solo lo alcanza el borde, por la red interna
    depends_on:
      influxdb-bases:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c",
             "import urllib.request;urllib.request.urlopen('http://localhost:8080/salud')"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 15s

  api:
    image: ghcr.io/${ORG_GITHUB:?falta ORG_GITHUB}/zenit-api:${VERSION_API:-0.2.0}
    build:
      context: ../backend
      dockerfile: Dockerfile.api
    restart: unless-stopped
    environment:
      <<: *influx
      RUTA_CATALOGO: /etc/zenit/catalogo/catalogo.json
    volumes:
      - ./catalogo:/etc/zenit/catalogo:ro
    # 8000 NO se publica: la API se alcanza por el borde en el 443
    depends_on:
      influxdb-bases:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c",
             "import urllib.request;urllib.request.urlopen('http://localhost:8000/api/salud')"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s

  web:
    image: ghcr.io/${ORG_GITHUB:?falta ORG_GITHUB}/zenit-web:${VERSION_WEB:-0.2.0}
    build: ../frontend
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/"]
      interval: 30s
      timeout: 3s
      retries: 3

  borde:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on:
      ingesta:
        condition: service_healthy
      api:
        condition: service_healthy
      web:
        condition: service_healthy
    # Sintaxis larga: si falta un archivo, el arranque falla con un mensaje
    # claro en vez de crear un directorio vacio en su lugar.
    volumes:
      - type: bind
        source: ./nginx.conf
        target: /etc/nginx/nginx.conf
        read_only: true
      - type: bind
        source: ./tls/servidor.crt
        target: /etc/nginx/tls/servidor.crt
        read_only: true
      - type: bind
        source: ./tls/servidor.key
        target: /etc/nginx/tls/servidor.key
        read_only: true
    ports:
      - "0.0.0.0:4317:4317"           # OTLP de los nodos
      - "0.0.0.0:443:443"             # interfaz y API, solo IP del equipo
    healthcheck:
      test: ["CMD-SHELL", "nginx -t || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  influx_datos:                        # series temporales, sobrevive al reinicio
  ingesta_datos:                       # trazas y registros en archivo
