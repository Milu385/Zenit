events {}

http {
  server_tokens off;   # sin version de nginx en errores ni cabeceras
  # Los nombres de los servicios se resuelven con el DNS interno de Docker en
  # cada peticion y no una sola vez al arrancar. Sin esto, recrear la ingesta
  # o la API (docker compose up -d --build) le cambia la IP y el borde sigue
  # mandando a la vieja: 502 hasta reiniciar el borde.
  resolver 127.0.0.11 valid=10s ipv6=off;
  # ---------------------------------------------------------------- OTLP
  # Los agentes llegan aqui (H-012, RNF-SEG-07, ADR-017). TLS se termina en el
  # borde con autenticacion mutua: el agente verifica el certificado del
  # servidor contra ca.crt, y el borde verifica el del agente contra la misma
  # CA. La ingesta valida ademas el token.

  # Emisor = el certificado del agente; sin certificado (modo transicion), la IP.
  map $ssl_client_s_dn $emisor {
    ""      $remote_addr;
    default $ssl_client_s_dn;
  }
  # Revocados, por numero de serie (deploy/borde/revocados.map).
  map $ssl_client_serial $revocado {
    default 0;
    include /etc/nginx/zenit/revocados.map;
  }
  # Limite por emisor: un agente que reintenta en bucle no deja sin servicio
  # a los demas. Lo normal de un nodo son pocas peticiones por segundo; al
  # vaciar su cola despues de un corte puede pasar de 50 y recibe 429, que el
  # agente trata como "reintentar mas tarde" (gRPC UNAVAILABLE): se frena, no
  # pierde nada.
  limit_req_zone $emisor zone=por_emisor:10m rate=50r/s;
  # Registro de lo rechazado y lo limitado, con su origen: JSON a la salida
  # del contenedor (docker compose logs borde) y a un archivo en un volumen.
  map $status $rechazo {
    ~^(400|401|403|429|495|496)$ 1;
    default 0;
  }
  log_format otlp_rechazo escape=json
    '{"momento":"$time_iso8601","origen":"$remote_addr","estado":$status,'
    '"verificacion":"$ssl_client_verify","emisor":"$ssl_client_s_dn",'
    '"serie":"$ssl_client_serial","vence":"$ssl_client_v_end","ruta":"$request_uri"}';

  server {
    listen 4317 ssl;
    http2 on;

    ssl_certificate        /etc/nginx/tls/servidor.crt;
    ssl_certificate_key    /etc/nginx/tls/servidor.key;
    ssl_protocols          TLSv1.2 TLSv1.3;
    ssl_client_certificate /etc/nginx/tls/ca.crt;
    # optional y no on: con "on" el rechazo ocurre en el saludo TLS y no queda
    # registrado con su origen. Asi se completa el saludo, se registra y se
    # responde 403 (gRPC PERMISSION_DENIED).
    ssl_verify_client      optional;
    ssl_verify_depth       1;

    access_log /dev/stdout otlp_rechazo if=$rechazo;
    access_log /var/log/zenit/rechazos-otlp.log otlp_rechazo if=$rechazo;

    client_max_body_size 16m;
    grpc_read_timeout    300s;
    grpc_send_timeout    300s;

    include /etc/nginx/zenit/mtls.conf;          # estricto o transicion (MTLS_MODO)
    if ($revocado) {
      return 403;
    }

    location / {
      limit_req zone=por_emisor burst=100 nodelay;
      limit_req_status 429;
      set $ingesta ingesta:4317;
      grpc_set_header x-zenit-emisor $ssl_client_s_dn;
      grpc_pass grpc://$ingesta;
    }
  }

  # ---------------------------------------------------------------- interfaz
  # El grupo de seguridad solo abre el 443 a las IP del equipo.
  server {
    listen 443 ssl;
    http2 on;

    ssl_certificate     /etc/nginx/tls/servidor.crt;
    ssl_certificate_key /etc/nginx/tls/servidor.key;
    ssl_protocols       TLSv1.2 TLSv1.3;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy no-referrer always;
    # Solo recursos propios: ni scripts ni fuentes de terceros (la tipografia va
    # dentro de la interfaz). style-src permite atributos style, que usan las
    # graficas; img-src permite data: porque Vite incrusta las imagenes pequenas.
    # HSTS no se pone: los navegadores lo ignoran para una direccion IP.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'none'; form-action 'self'; frame-ancestors 'none'" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    location /api/ {
      set $api api:8000;
      proxy_pass         http://$api;
      proxy_set_header   Host $host;
      proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header   X-Forwarded-Proto https;
      proxy_read_timeout 30s;
    }

    location / {
      set $web web:80;
      proxy_pass http://$web;
    }
  }
}
