events {}

http {
  # Los nombres de los servicios se resuelven con el DNS interno de Docker en
  # cada peticion y no una sola vez al arrancar. Sin esto, recrear la ingesta
  # o la API (docker compose up -d --build) le cambia la IP y el borde sigue
  # mandando a la vieja: 502 hasta reiniciar el borde.
  resolver 127.0.0.11 valid=10s ipv6=off;
  # ---------------------------------------------------------------- OTLP
  # Los agentes llegan aqui. TLS se termina en el borde y la ingesta valida
  # el token.
  server {
    listen 4317 ssl;
    http2 on;

    ssl_certificate     /etc/nginx/tls/servidor.crt;
    ssl_certificate_key /etc/nginx/tls/servidor.key;
    ssl_protocols       TLSv1.2 TLSv1.3;

    client_max_body_size 16m;
    grpc_read_timeout    300s;
    grpc_send_timeout    300s;

    location / {
      set $ingesta ingesta:4317;
      grpc_pass grpc://$ingesta;
    }
  }

  # ---------------------------------------------------------------- interfaz
  # El grupo de seguridad solo abre el 443 a las IP del equipo.
  server {
    listen 443 ssl;
    http2 on;

    ssl_certificate     /etc/nginx/tls/servidor.crt;
    ssl_certificate_key /etc/nginx/tls/servidor.key;
    ssl_protocols       TLSv1.2 TLSv1.3;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy no-referrer always;

    location /api/ {
      set $api api:8000;
      proxy_pass         http://$api;
      proxy_set_header   Host $host;
      proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header   X-Forwarded-Proto https;
      proxy_read_timeout 30s;
    }

    location / {
      set $web web:80;
      proxy_pass http://$web;
    }
  }
}
