# Modo de transicion: mientras se reparten los certificados, un agente SIN
# certificado entra todavia (con el token, como en la epica 0), pero uno con
# un certificado invalido, vencido o de otra CA se rechaza. Cuando todos los
# nodos tengan el suyo, MTLS_MODO=estricto en deploy/.env y se recrea el borde.
if ($ssl_client_verify ~ ^FAILED) {
  return 403;
}
