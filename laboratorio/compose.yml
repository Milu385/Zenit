name: zenit-laboratorio

x-recursos: &recursos
  deploy:
    resources:
      limits:
        cpus:   "${LIMITE_CPU:-1.0}"
        memory: "${LIMITE_MEMORIA:-512m}"

x-identidad: &identidad
  ZENIT_ENTORNO:   ${ZENIT_ENTORNO:-desconocido}
  ZENIT_PROVEEDOR: ${ZENIT_PROVEEDOR:-desconocido}
  ZENIT_REGION:    ${ZENIT_REGION:-desconocido}
  ZENIT_NODO:      ${ZENIT_NODO:?falta el nombre del nodo}

services:

  almacen:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER:     ${ALMACEN_USUARIO:-zenit}
      POSTGRES_PASSWORD: ${ALMACEN_CLAVE:?falta ALMACEN_CLAVE}
      POSTGRES_DB:       ${ALMACEN_BD:-zenit}
    volumes:
      - almacen_datos:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${ALMACEN_USUARIO:-zenit} -d ${ALMACEN_BD:-zenit}"]
      interval: 5s
      timeout: 3s
      retries: 10
    <<: *recursos
    # sin perfil: es la base de todo, siempre arranca

  catalogo:
    image: ghcr.io/${ORG_GITHUB:?falta ORG_GITHUB}/zenit-catalogo:${VERSION_APP:-0.2.0}
    build: ./servicios/catalogo
    restart: unless-stopped
    init: true             # reenvia SIGTERM: apagado en ~1 s, no en 10
    depends_on:
      almacen:
        condition: service_healthy
    environment:
      <<: *identidad
      ALMACEN_USUARIO: ${ALMACEN_USUARIO:-zenit}
      ALMACEN_CLAVE:   ${ALMACEN_CLAVE:?falta ALMACEN_CLAVE}
      ALMACEN_BD:      ${ALMACEN_BD:-zenit}
      OTEL_SERVICE_NAME: catalogo
      # click envuelve todo el proceso de uvicorn en un span que nunca termina:
      # sin esto, todas las peticiones quedan en una sola traza sin raiz.
      OTEL_PYTHON_DISABLED_INSTRUMENTATIONS: click
      OTEL_TRACES_EXPORTER: ${EXPORTADOR_TRAZAS:-none}
      OTEL_LOGS_EXPORTER: ${EXPORTADOR_REGISTROS:-none}
      OTEL_PYTHON_LOGGING_AUTO_INSTRUMENTATION_ENABLED: "true"
      OTEL_EXPORTER_OTLP_ENDPOINT: http://agente:4317
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request;urllib.request.urlopen('http://localhost:8000/salud')\""]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 20s
    <<: *recursos
    profiles: ["completo"]

  pedidos:
    image: ghcr.io/${ORG_GITHUB:?falta ORG_GITHUB}/zenit-pedidos:${VERSION_APP:-0.2.0}
    build: ./servicios/pedidos
    restart: unless-stopped
    init: true             # reenvia SIGTERM: apagado en ~1 s, no en 10
    depends_on:
      almacen:
        condition: service_healthy
    environment:
      <<: *identidad
      URL_CATALOGO: http://catalogo:8000
      OTEL_SERVICE_NAME: pedidos
      # click envuelve todo el proceso de uvicorn en un span que nunca termina:
      # sin esto, todas las peticiones quedan en una sola traza sin raiz.
      OTEL_PYTHON_DISABLED_INSTRUMENTATIONS: click
      OTEL_TRACES_EXPORTER: ${EXPORTADOR_TRAZAS:-none}
      OTEL_LOGS_EXPORTER: ${EXPORTADOR_REGISTROS:-none}
      OTEL_PYTHON_LOGGING_AUTO_INSTRUMENTATION_ENABLED: "true"
      OTEL_EXPORTER_OTLP_ENDPOINT: http://agente:4317
    # H-027: el inyector pone tc netem en este contenedor para degradar solo el
    # enlace hacia catalogo. NET_ADMIN solo vale dentro de su propia red.
    cap_add: [NET_ADMIN]
    ports:
      - "${IP_PEDIDOS:-127.0.0.1}:8000:8000"   # on-premise la cambia por variable
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request;urllib.request.urlopen('http://localhost:8000/salud')\""]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 20s
    <<: *recursos

  carga:
    image: ghcr.io/${ORG_GITHUB:?falta ORG_GITHUB}/zenit-carga:${VERSION_APP:-0.2.0}
    build: ./servicios/carga
    restart: unless-stopped
    init: true             # reenvia SIGTERM: apagado en ~1 s, no en 10
    depends_on: [pedidos]
    environment:
      URL_PEDIDOS:       http://pedidos:8000/pedidos
      CARGA_RPS:         ${CARGA_RPS:-5}
      CARGA_MAX_EN_VUELO: ${CARGA_MAX_EN_VUELO:-50}
      CARGA_DURACION:    ${CARGA_DURACION:-0}
      # perfil de H-023; vacio = CARGA_RPS constante
      CARGA_PERFIL:      ${CARGA_PERFIL:-}
    volumes:
      - ./perfiles:/perfiles:ro
    profiles: ["carga"]

  # Emisor de prueba para las mediciones de la ingesta (P-REN-01, P-REN-02,
  # H-016, H-031). No corre solo: se lanza con "run --rm sonda <modo>".
  sonda:
    image: ghcr.io/${ORG_GITHUB:?falta ORG_GITHUB}/zenit-sonda:${VERSION_APP:-0.2.0}
    build: ./servicios/sonda
    init: true
    depends_on: [agente]
    profiles: ["medicion"]

  # Inyector de fallos y campana desatendida (epica 2). Opera solo sobre este
  # nodo: no tiene red (network_mode: none), asi que no puede alcanzar la
  # plataforma (RF-LAB-04). Su unica salida es el archivo de verdad de
  # referencia, que el agente envia.
  inyector:
    image: ghcr.io/${ORG_GITHUB:?falta ORG_GITHUB}/zenit-inyector:${VERSION_APP:-0.2.0}
    build: ./servicios/inyector
    restart: unless-stopped
    init: true
    network_mode: none
    # bajo el agente en el reparto de CPU: si hay contencion, el agente sigue midiendo
    cpu_shares: 256
    stop_grace_period: 150s    # tiempo para restaurar el nodo y cerrar la inyeccion en curso
    environment:
      ZENIT_NODO:       ${ZENIT_NODO:?falta el nombre del nodo}
      PROYECTO:         zenit-laboratorio
      SERVICIOS_CAIDA:  ${SERVICIOS_CAIDA:-catalogo,pedidos}
      CAMPANA_SEMILLA:  ${CAMPANA_SEMILLA:-1}
      CALENTAMIENTO_H:  ${CALENTAMIENTO_H:-12}
      INTERVALO_MIN:    ${INTERVALO_MIN:-60}
      INTERVALO_MAX:    ${INTERVALO_MAX:-150}
      NORMAL_MIN:       ${NORMAL_MIN:-45}
      CAMPANA_TIPOS:    ${CAMPANA_TIPOS:-cpu,memoria,disco_gradual,disco_abrupto,caida}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock   # solo para detener y levantar servicios de este nodo
      - verdad:/var/lib/zenit-lab
      - relleno:/datos/relleno                     # vive en el disco raiz del nodo
    profiles: ["laboratorio"]

  agente:
    image: otel/opentelemetry-collector-contrib:0.116.1
    user: "0:0"                # escribe en su volumen y lee /proc de todos los procesos
    restart: unless-stopped
    command: ["--config=/etc/otelcol/collector.yaml"]
    environment:
      <<: *identidad
      DESTINO_OTLP:     ${DESTINO_OTLP:?falta el destino de telemetria}
      OTLP_INSEGURO:    ${OTLP_INSEGURO:-false}
      RUTA_CA:          ${RUTA_CA:-/etc/otelcol/ca.crt}
      TOKEN_INGESTA:    ${TOKEN_INGESTA:?falta el token de ingesta}
      INTERVALO_METRICAS: ${INTERVALO_METRICAS:-10s}
      RUTA_CERT_CLIENTE:  ${RUTA_CERT_CLIENTE:-}
      RUTA_CLAVE_CLIENTE: ${RUTA_CLAVE_CLIENTE:-}
    volumes:
      - ./agente/collector.yaml:/etc/otelcol/collector.yaml:ro
      - ./agente/ca.crt:/etc/otelcol/ca.crt:ro   # publico: va versionado
      - ./agente/cliente:/etc/otelcol/cliente:ro # certificado y clave de ESTE nodo: no se versionan
      - agente_cola:/var/lib/otelcol/cola
      - verdad:/var/lib/zenit-lab:ro               # verdad de referencia del inyector
      - /:/hostfs:ro,rslave
    pid: host
    profiles: ["observado"]

volumes:
  almacen_datos:
  agente_cola:
  verdad:
  relleno:
